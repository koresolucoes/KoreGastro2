<div class="flex min-h-screen bg-surface relative overflow-hidden">
  <!-- Theme Toggle Floating Button -->
  <div class="absolute top-6 right-6 z-20">
    <button (click)="toggleTheme()" type="button" 
            class="flex items-center gap-2 px-4 py-2 rounded-xl bg-surface border border-strong text-muted hover:text-title hover:border-brand transition-all active:scale-95 text-sm font-bold">
      <span translate="no" class="notranslate material-symbols-outlined text-lg">
        {{ themeService.currentTheme() === 'dark' ? 'light_mode' : 'dark_mode' }}
      </span>
      <span class="hidden sm:inline">{{ themeService.currentTheme() === 'dark' ? 'Modo Claro' : 'Modo Escuro' }}</span>
    </button>
  </div>

  <!-- Left Side: Branding -->
  <div class="hidden lg:flex lg:w-1/2 relative bg-surface-elevated border-r border-strong">
    <div class="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1555396273-367ea4eb4db5?q=80&w=1974&auto=format&fit=crop')] bg-cover bg-center opacity-40"></div>
    <div class="absolute inset-0 bg-gradient-to-t from-black/80 to-transparent"></div>
    <div class="relative z-10 flex flex-col justify-end p-16 pb-24 w-full text-white">
      <h1 class="text-6xl font-black mb-6 tracking-tight">
        ChefOS
      </h1>
      <p class="text-xl font-medium max-w-md leading-relaxed text-white/90">
        O sistema de gestão definitivo para o seu restaurante. Simples, rápido e integrado.
      </p>
    </div>
  </div>

  <!-- Right Side: Form -->
  <div class="w-full lg:w-1/2 flex flex-col justify-center items-center p-6 sm:p-16 relative z-10 bg-surface">
    <div class="w-full max-w-md">
      <div class="mb-12">
        <h1 class="text-4xl font-black text-title mb-2 lg:hidden tracking-tight">
          ChefOS
        </h1>
        <h2 class="text-3xl font-black text-title tracking-tight mb-3">Criar conta</h2>
        <p class="text-base text-muted font-medium">Preencha seus dados para começar.</p>
      </div>
      
      <form class="space-y-5" (ngSubmit)="handleRegister()" novalidate>
        <div class="space-y-4">
          <div class="space-y-1.5">
            <label for="email-address" class="block text-sm font-bold text-title">E-mail</label>
            <input id="email-address" name="email" type="email" autocomplete="email" required
              [value]="email()" (input)="email.set($any($event.target).value)"
              class="block w-full px-4 py-3.5 text-base bg-surface border border-strong rounded-xl text-title placeholder-muted focus:outline-none focus:ring-2 focus:ring-brand/30 focus:border-brand transition-all" 
              placeholder="seu-email@dominio.com">
          </div>
          <div class="space-y-1.5">
            <label for="password" class="block text-sm font-bold text-title">Senha</label>
            <input id="password" name="password" type="password" autocomplete="new-password" required
              [value]="password()" (input)="password.set($any($event.target).value)"
              class="block w-full px-4 py-3.5 text-base bg-surface border border-strong rounded-xl text-title placeholder-muted focus:outline-none focus:ring-2 focus:ring-brand/30 focus:border-brand transition-all" 
              placeholder="Mínimo de 6 caracteres">
          </div>
          <div class="space-y-1.5">
            <label for="confirm-password" class="block text-sm font-bold text-title">Confirmar Senha</label>
            <input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" required
              [value]="confirmPassword()" (input)="confirmPassword.set($any($event.target).value)"
              class="block w-full px-4 py-3.5 text-base bg-surface border border-strong rounded-xl text-title placeholder-muted focus:outline-none focus:ring-2 focus:ring-brand/30 focus:border-brand transition-all" 
              placeholder="Digite a senha novamente">
          </div>
        </div>

        @if(authState() === 'error') {
          <div class="p-4 bg-danger/10 rounded-xl">
            <p class="text-sm font-bold text-danger">{{ errorMessage() }}</p>
          </div>
        }

        <button type="submit" [disabled]="authState() === 'loading'"
          class="w-full flex justify-center items-center gap-2 py-4 px-4 text-base font-bold rounded-xl text-white bg-brand hover:brightness-110 focus:outline-none focus:ring-2 focus:ring-brand/30 disabled:opacity-50 disabled:cursor-not-allowed transition-all mt-8 shadow-sm">
          @if(authState() === 'loading') {
            <span translate="no" class="notranslate material-symbols-outlined animate-spin">progress_activity</span>
            Cadastrando...
          } @else {
             Criar minha conta
          }
        </button>
      </form>

      <div class="pt-8 mt-8 border-t border-subtle">
        <p class="text-sm font-medium text-muted">
          Já possui uma conta?
          <a routerLink="/login" class="font-bold text-title hover:underline ml-1">
            Fazer login
          </a>
        </p>
      </div>
    </div>
  </div>
</div>
